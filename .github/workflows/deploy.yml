# Deploys WatchBridge to GitHub Pages.
#
# This assumes WatchBridge lives at the ROOT of its own repository. If you keep
# it inside a monorepo, move this file to the repo's top-level
# .github/workflows/ and set `working-directory` / upload path to the subfolder.
# Note: a GitHub repo can only host ONE Pages site — see the README for options.
name: Deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run search-index:build
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
