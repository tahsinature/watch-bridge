services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: config
      POSTGRES_PASSWORD: config
      POSTGRES_DB: config_sync
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/api/drizzle/0000_initial.sql:/docker-entrypoint-initdb.d/0000_initial.sql:ro
      - ./apps/api/drizzle/0001_browser_connect.sql:/docker-entrypoint-initdb.d/0001_browser_connect.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config -d config_sync"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment:
      DATABASE_URL: postgres://config:config@db:5432/config_sync
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
    ports: ["3000:3000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: {VITE_API_URL: http://localhost:3000}
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  postgres-data:
